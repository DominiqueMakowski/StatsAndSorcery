# Every pull request gets its own playable build at
#   https://dominiquemakowski.github.io/StatsAndSorcery/pr-preview/pr-<number>/
# The action comments the link on the PR and removes the folder when the PR is closed.
# (Pull requests from forks can't deploy: they don't get write access to the branch.)

name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        if: github.event.action != 'closed'
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        if: github.event.action != 'closed'
      - run: bun test
        if: github.event.action != 'closed'
      - run: bun run build
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
