<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Stats & Sorcery: a wizard duelling game to build your statistical intuition." />
        <title>Stats & Sorcery</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&family=Permanent+Marker&display=swap"
            rel="stylesheet"
        />
      <script type="module" crossorigin src="./assets/index-DG8Jl233.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-DVQD8ouR.css">
    </head>
    <body>
        <div id="app">
            <section id="title-screen" class="screen">
                <div class="title-wrap">
                    <h1 class="title">Stats <span class="amp">&amp;</span> Sorcery</h1>
                    <p class="tagline">a wizard duelling game to build your statistical intuition</p>
                    <canvas id="title-canvas" class="title-canvas" aria-hidden="true"></canvas>
                    <nav class="menu">
                        <button class="btn btn-primary" data-mode="run">Start a run</button>
                        <button class="btn" data-mode="pve">Quick duel</button>
                        <button class="btn" data-mode="pvp">Two players</button>
                        <button class="btn btn-quiet" id="actions-btn">Action list</button>
                    </nav>
                    <p class="fine-print"><a href="#" id="tips-reset">show tips again</a></p>
                </div>
                <aside class="sticky sticky-howto" aria-label="How it works">
                    <h2>how it works</h2>
                    <p>Spells never fly quite where you aim. Guess, cast, then check: the hatched band shows where <b>95%</b> land.</p>
                    <p><b>2 ★</b> action points a turn: line up, cast, dodge.</p>
                </aside>
                <div class="doodle doodle-star" aria-hidden="true">★</div>
                <div class="doodle doodle-bolt" aria-hidden="true">⚡</div>
                <div class="doodle doodle-zzz" aria-hidden="true">z z z</div>
            </section>

            <section id="duel-screen" class="screen" hidden>
                <header class="hud">
                    <div class="wizard-panel" id="panel-left"></div>
                    <div class="turn-banner" id="turn-banner"></div>
                    <div class="wizard-panel is-right" id="panel-right"></div>
                </header>
                <main class="field-wrap" id="field-wrap">
                    <canvas id="field"></canvas>
                    <div class="coach" id="coach" hidden>
                        <svg class="coach-owl" viewBox="0 0 48 54" aria-hidden="true">
                            <path d="M10 16 C 7 30, 9 41, 24 47 C 39 41, 41 30, 38 16 Z" />
                            <path d="M10 16 L6 5 L17 12 M38 16 L42 5 L31 12" />
                            <circle class="eye" cx="18" cy="23" r="6.5" />
                            <circle class="eye" cx="30" cy="23" r="6.5" />
                            <circle class="pupil" cx="19" cy="23" r="2.3" />
                            <circle class="pupil" cx="31" cy="23" r="2.3" />
                            <path class="beak" d="M22 29 L24 34 L26 29 Z" />
                            <path d="M15 36 q4 3 8 0 M25 36 q4 3 8 0 M13 41 q5 3 10 0 M25 41 q5 3 10 0" />
                            <path d="M19 47 l-2 5 M21 47 l0 5 M27 47 l0 5 M29 47 l2 5" />
                        </svg>
                        <p class="coach-text"></p>
                        <button class="coach-close" aria-label="Dismiss tip">×</button>
                    </div>
                    <aside class="rules-note" id="rules" aria-label="Rules" hidden>
                        <h2>rules</h2>
                        <ol class="rules-list"></ol>
                        <div class="rules-foot">
                            <button class="btn btn-primary rules-ok">Got it!</button>
                        </div>
                    </aside>
                </main>
                <footer class="tray">
                    <div class="hand" id="hand"></div>
                    <div class="tray-actions">
                        <button class="btn btn-primary btn-cast" id="cast-btn">Cast!</button>
                        <p class="tray-hint" id="tray-hint"></p>
                    </div>
                </footer>
                <div class="corner-actions">
                    <button class="link-btn" id="rules-btn">? rules</button>
                    <button class="link-btn" id="mute-btn">♪ sound on</button>
                    <button class="link-btn" id="quit-btn">✕ quit</button>
                </div>
            </section>

            <div class="overlay" id="overlay" hidden>
                <div class="overlay-content" id="overlay-content"></div>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
    </body>
</html>
